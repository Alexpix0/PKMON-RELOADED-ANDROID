[workspace]
resolver = "2"
exclude = ["gm8emulator-wow64"]
members = [
    # main projects
    "gm8emulator",
    "gm8decompiler",
    "gml-parser",
    "gm8exe",
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false
debug-assertions = false
debug = false
